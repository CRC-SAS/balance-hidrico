# Plataforma web de escenarios individuales (balancehidrico): API de
# simulacion (R/plumber) + frontend (Next.js).
#
# Usa las imagenes publicadas en GitHub Container Registry (se construyen
# y publican automaticamente con cada cambio en la rama "main", ver
# .github/workflows/build.yml) -- no construye nada localmente.
#
# Uso (desde la carpeta donde esta este archivo):
#   docker compose up        # levanta ambos servicios
#   docker compose down      # los detiene
# Luego abrir http://localhost:3000 en el navegador.
#
# La API (puerto 8000) no se publica hacia afuera: solo es alcanzable desde
# el frontend por la red interna de Compose (API_URL=http://api:8000).
#
# Para construir las imagenes desde el codigo fuente en vez de usar las
# publicadas, ver docker-compose.dev.yml.
#
# platform: las imagenes publicadas son linux/amd64. Se fija aca para que
# tambien funcionen (emuladas) en Mac con procesador Apple Silicon.
services:
  api:
    image: ghcr.io/crc-sas/balance-hidrico-api:latest
    platform: linux/amd64
    expose:
      - "8000"
    restart: unless-stopped

  frontend:
    image: ghcr.io/crc-sas/balance-hidrico-frontend:latest
    platform: linux/amd64
    ports:
      - "3000:3000"
    environment:
      - API_URL=http://api:8000
    depends_on:
      - api
    restart: unless-stopped
