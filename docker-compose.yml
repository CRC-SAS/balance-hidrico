# Plataforma de escenarios individuales (balancehidrico). Ver
# /home/santiago/.claude/plans/atomic-roaming-wadler.md para el diseno
# completo.
#
# Uso (desde la raiz del repo, con balance_hidrico.sqlite presente):
#   docker compose up --build
# Frontend en http://localhost:3000 -- la API (puerto 8000) no se publica
# al host, solo es alcanzable desde el frontend via la red interna de
# compose (API_URL=http://api:8000).
services:
  api:
    build:
      context: .
      dockerfile: api/Dockerfile
    expose:
      - "8000"
    restart: unless-stopped

  frontend:
    build:
      context: .
      dockerfile: frontend/Dockerfile
    ports:
      - "3000:3000"
    environment:
      - API_URL=http://api:8000
    depends_on:
      - api
    restart: unless-stopped
